<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us | Dream Travel Agency</title>
<link rel="stylesheet" href="contactus style.css">
</head>
<body>


<header class="top-header">
  <div class="nav-container">
    <h2 class="logo-text">Dream Travel</h2>

    <nav>
      <a href="home.html">Home</a>
      <a href="gallery.html">Gallery</a>
      <a href="tour.html">Tours</a>
      <a href="contac tus.html" class="active">Contact</a>
    </nav>
  </div>

  <h1>Contact Us</h1>
  <p>We’d love to hear from you!</p>
</header>

<main class="contact-main">

  
  <section class="contact-info">
    <div class="info-card">
      <h2>Email</h2>
      <p>dreamtravel@gmail.com</p>
    </div>

    <div class="info-card">
      <h2>Phone</h2>
      <p>+92 300 1234567</p>
    </div>

    <div class="info-card">
      <h2>Address</h2>
      <p>123 Dream Street, Islamabad, Pakistan</p>
    </div>
  </section>

  
  <section class="contact-form">
    <form>
      <input type="text" placeholder="Your Name" required>
      <input type="email" placeholder="Your Email" required>
      <textarea rows="6" placeholder="Your Message" required></textarea>
      <button type="submit">Send Message</button>
    </form>
  </section>

</main>

<footer class="footer">
  <p>&copy; 2025 Dream Travel Agency | All Rights Reserved</p>
</footer>

</body>
</html>
